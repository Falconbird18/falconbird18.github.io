<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Portfolio - Austin Tallent</title>
        <link rel="icon" type="image/x-icon" href="images/logo.svg" />
        <link rel="stylesheet" href="css/global.css" />
        <link rel="stylesheet" href="css/index.css" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Baskervville:ital,wght@0,400..700;1,400..700&family=Rubik:ital,wght@0,300..900;1,300..900&display=swap"
            rel="stylesheet"
        />
    </head>
    <body>
        <!--Page header-->
        <input type="checkbox" id="menuToggle" />
        <header class="primaryGlass">
            <a href="index.html">
                <img
                    class="logo"
                    src="images/profile.webp"
                    alt="A profile headshot"
                />
            </a>
            <label for="menuToggle" class="hamburger">
                <span></span>
                <span></span>
                <span></span>
            </label>
            <nav>
                <ul>
                    <li><a href="html/about.html">About</a></li>
                    <li><a href="html/gallery.html">Gallery</a></li>
                    <li><a href="html/music.html">Music</a></li>
                    <li><a href="html/contact.html">Contact</a></li>
                </ul>
            </nav>
        </header>
        <nav class="menu primaryGlass">
            <ul>
                <li><a href="html/about.html">About</a></li>
                <li><a href="html/gallery.html">Gallery</a></li>
                <li><a href="html/music.html">Music</a></li>
                <li><a href="html/contact.html">Contact</a></li>
            </ul>
        </nav>

        <!--Main page content-->
        <main>
            <section id="welcome">
                <img id="welcomeBackground" src="images/background.webp" />
                <h1 id="firstName">AUSTIN</h1>
                <img
                    id="welcomeImage"
                    src="images/interior_with_sofas_and_plants.webp"
                    alt="A render of a modern living room"
                />
                <h1 id="lastName">TALLENT</h1>
            </section>
            <section id="gallery">
                <div class="fullSizeImageStage">
                    <img
                        class="fullSizeImage"
                        src="images/interior_with_sofas_and_plants.webp"
                        alt="A render of a modern living room"
                    />
                    <img
                        class="fullSizeImageOverlay fullSizeImageOverlayOne"
                        src="images/garden_of_tranquility.webp"
                        alt="Garden of Tranquility"
                    />
                    <img
                        class="fullSizeImageOverlay fullSizeImageOverlayTwo"
                        src="images/movie-poster.webp"
                        alt="An epic movie poster"
                    />
                </div>
                <div class="imageContainer">
                    <img
                        class="halfSizeImageLeft"
                        src="images/garden_of_tranquility.webp"
                        alt="Garden of Tranquility"
                    />
                    <img
                        class="halfSizeImageRight"
                        src="images/movie-poster.webp"
                        alt="An epic movie poster"
                    />
                </div>
                <!--Horizontal scroll cards-->
                <div class="scrollContainer">
                    <div class="scrollCard">
                        <img
                            src="images/new_york.webp"
                            alt="Modern New York Loft"
                        />
                        <h4>Architectural Visualization</h4>
                    </div>
                    <div class="scrollCard">
                        <img src="images/free_bft.webp" alt="A movie poster" />
                        <h4>Graphic Design</h4>
                    </div>
                    <div class="scrollCard">
                        <img
                            src="images/apples.webp"
                            alt="A rendering of some apples"
                        />
                        <h4>3D Modeling</h4>
                    </div>
                    <div class="scrollCard">
                        <img
                            src="images/cat.webp"
                            alt="Portrait of a Black Cat"
                        />
                        <h4>Portrait of a Black Cat</h4>
                    </div>
                    <div class="scrollCard">
                        <img
                            src="images/lilly.webp"
                            alt="White Lilly in a Dark Room"
                        />
                        <p>White Lilly in a Dark Room</p>
                    </div>
                </div>
            </section>
        </main>
        <!--Footer-->
        <footer>
            <a href="mailto:atallent2@students.columbiabasin.edu"
                >atallent2@students.columbiabasin.edu</a
            >
            <p>&copy; Austin Tallent 2026</p>
        </footer>
        <script src="javascript/imageExpand.js"></script>
        <script src="javascript/headerHide.js"></script>
    </body>
</html>
