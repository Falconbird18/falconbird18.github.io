        <!--Main page content-->

                    <!-- Filter Buttons -->

                        <button id="filter" class="secondary-button" data-filter="all">
                            All
                        </button>
                        <button id="filter" class="secondary-button" data-filter="3d">
                            3D art
                        </button>
                        <button
                            id="filter"
                            class="secondary-button"
                            data-filter="graphicDesign"
                        >
                            Graphic design
                        </button>
                        <button
                            id="filter"

                        </button>

                    <!-- Gallery Grid -->
                    <div class="small-gallery-grid">
                        <div class="small-gallery-column">
                            <div
                                class="gallery-item paintings"
                                onclick="openModal('../../images/vineyard.jpg', 'Vineyard with Grapes', '12 x 17', 'Oil on canvas', 'This oil landscape of a dusk-lit vineyard showcases my traditional painting roots, blending observation and technique creativity.', '')"
                            >
                                <div class="image-wrapper">
                                    <img
                                        src="../images/vineyard.jpg"
                                        alt="Vineyard with Grapes"
                                        style="--index: 2"
                                    />
                                    <img
                                        src="../images/vineyard.jpg"
                                        alt="Vineyard with Grapes blurred"
                                        class="blurred-image"
                                        style="--index: 1"
                                    />
                                </div>
                            </div>
                            <div
                                class="gallery-item 3d"
                                onclick="openModal('../images/interior_with_sofas_and_plants.png', 'Interior with Sofas and Plants', '1 x 1', '3D', 'This Blender-rendered living room fosters tranquility through natural light and composition. It marks my shift to 3D, expanding from 2D art to immersive designs that creative and artistically unique.', '')"

                                <div class="image-wrapper">
                                    <img
                                        src="../images/interior_with_sofas_and_plants.png"
                                        alt="Interior with sofas and plants blurred"
                                        style="--index: 2"
                                    />
                                    <img
                                        src="../images/interior_with_sofas_and_plants.png"
                                        alt="Interior with sofas and plants blurred"
                                        class="blurred-image"
                                        style="--index: 1"
                                    />
                                </div>
                            </div>
                            <div
                                class="gallery-item paintings"
                                onclick="openModal('../images/cephas.jpg', 'Portrait of Cephas', '9 x 12', 'Oil on canvas', 'This oil portrait evokes life in art. It highlights my portraiture skill, using classical techniques to create a striking image.', '')"

                                <div class="image-wrapper">
                                    <img
                                        src="../images/cephas.jpg"
                                        alt="Portrait of Cephas"
                                        style="--index: 2"
                                    />
                                    <img
                                        src="../images/cephas.jpg"
                                        alt="Portrait of Cephas blurred"
                                        class="blurred-image"
                                        style="--index: 1"
                                    />
                                </div>
                            </div>
                            <div
                                class="gallery-item graphicDesign"
                                onclick="openModal('../images/movie-brocure-render.png', 'Last Keeper of Vareth Brocure', 'US Letter', 'Print', 'This tri-fold fantasy brochure builds a world with custom graphics created with traditional art in mind. It demonstrates my adoption of design, enriching my broad artistic range.', '')"
                            >
                                <div class="image-wrapper">
                                    <img
                                        src="../images/movie-brocure-render.png"
                                        alt="Last Keeper of Vareth Brocure"
                                        style="--index: 2"
                                    />
                                    <img
                                        src="../images/movie-brocure-render.png"
                                        alt="Last Keeper of Vareth Brocure blurred"
                                        class="blurred-image"
                                        style="--index: 1"
                                    />
                                </div>
                            </div>
                            <div
                                class="gallery-item webDesign"

                                    <img
                                        src="../images/rhs.png"
                                        alt="RHS Robotics Website"
                                        style="--index: 2"
                                    />
                                    <img
                                        src="../images/rhs.png"
                                        alt="RHS Robotics Website blurred"
                                        class="blurred-image"

                                    <img

                                        class="blurred-image"
                                        style="--index: 1"

                                class="gallery-item paintings"
                                onclick="openModal('../images/cat.jpg', 'Portrait of a Black Cat', '12 x 17', 'Oil on canvas', 'This oil painting captures a cat\'s grace using the alla prima technique. It exemplifies my animal portrait experience, complementing my diverse digital and design talents.', '')"

                                        alt="Portrait of a Black Cat"

                                        style="--index: 1"

                                    <img

                                <div class="image-wrapper">
                                    <img
                                        src="../images/new_york.png"
                                        alt="Modern New York loft"
                                        style="--index: 2"

                                    <img
                                        src="../images/new_york.png"
                                        alt="Modern New York loft blurred"
                                        class="blurred-image"

                                </div>

                            <div
                                class="gallery-item webDesign"
                                onclick="openModal('../images/christ_church.png', 'Christ Church Tri-Cities website', 'Responsive', 'Web', 'This redesign communicates in an artistic way. It highlights how traditional art serves as a solid foundation for creative digital problem-solving.', 'https://christchurchtricities.org')"

                                        alt="Christ Church Tri-Cities website blurred"

                                        style="--index: 1; --scale: 1.1"

                                        style="--index: 1; --scale: 1.1"
